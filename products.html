<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Purchase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <a href="products.html" class="site-title">Purchase<span>.</span></a>
      <nav>
        <a href="home.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html" class="cart-link">Cart <span id="cart-count" class="cart-count" style="display: none;">0</span></a>
        <a href="dashboard.html" id="nav-dashboard" style="display: none; color: var(--accent);">Dashboard</a>
        <button type="button" class="logout-btn" id="logout">Log out</button>
      </nav>
    </div>
  </header>
  <main class="container">
    <h1 class="page-title">Products</h1>
    <div class="search-bar-wrap">
      <input type="search" id="product-search" class="search-input" placeholder="Search products by name…" aria-label="Search products">
    </div>
    <div class="products-grid" id="products-grid">
      <p class="text-muted">Loading products…</p>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    (async function() {
      initProtectedPage();
      document.getElementById('logout').addEventListener('click', function() {
        clearAuth();
        setCart([]);
        window.location.href = 'index.html';
      });

      try {
        const me = await apiRequest('/api/me');
        if (me.user && me.user.is_owner) document.getElementById('nav-dashboard').style.display = 'inline';
      } catch (e) {}
      const grid = document.getElementById('products-grid');
      let products = [];
      try {
        products = await fetchProducts();
      } catch (err) {
        grid.innerHTML = '<p class="form-error">Could not load products. Is the server running on port 5000?</p>';
        return;
      }
      function renderProducts(list) {
        grid.innerHTML = '';
        if (list.length === 0) {
          grid.innerHTML = '<p class="text-muted">No products match your search.</p>';
          return;
        }
        list.forEach(function(p) {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML =
            '<img src="' + escapeHtml(p.image || '') + '" alt="' + escapeHtml(p.name || '') + '">' +
            '<div class="info">' +
              '<h3>' + escapeHtml(p.name || '') + '</h3>' +
              '<div class="price">' + formatPrice(p.price) + '</div>' +
              '<button type="button" class="btn btn-primary btn-sm add-cart" data-id="' + p.id + '">Add to cart</button>' +
            '</div>';
          grid.appendChild(card);
        });
      }

      function filterProducts() {
        const q = (document.getElementById('product-search').value || '').trim().toLowerCase();
        const filtered = q
          ? products.filter(function(p) { return (p.name || '').toLowerCase().indexOf(q) !== -1; })
          : products;
        renderProducts(filtered);
      }

      renderProducts(products);
      document.getElementById('product-search').addEventListener('input', filterProducts);
      document.getElementById('product-search').addEventListener('search', filterProducts);

      grid.addEventListener('click', function(e) {
        const btn = e.target.closest('.add-cart');
        if (!btn) return;
        const id = btn.getAttribute('data-id');
        const product = getProductById(id, products);
        if (product) {
          addToCart(product);
          btn.textContent = 'Added!';
          setTimeout(function() { btn.textContent = 'Add to cart'; }, 1200);
        }
      });
    })();
  </script>
</body>
</html>
